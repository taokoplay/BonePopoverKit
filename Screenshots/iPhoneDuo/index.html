<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone Duo 匹配截图 — BonePopoverKit</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #0e0e10;
    color: #e8e8ea;
    padding: 40px 32px 64px;
  }
  header { max-width: 1080px; margin: 0 auto 36px; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: .2px; }
  .meta { margin-top: 10px; font-size: 13.5px; color: #9a9aa2; line-height: 1.7; }
  .meta code {
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    background: #1d1d21; border: 1px solid #2c2c31; border-radius: 5px;
    padding: 1px 6px; font-size: 12px; color: #c8c8cf;
  }
  .badge {
    display: inline-block; margin-right: 8px; padding: 2px 10px; border-radius: 999px;
    background: #17251c; border: 1px solid #274434; color: #6fd39a; font-size: 12px;
  }
  .grid {
    max-width: 1080px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px;
  }
  figure {
    background: #17171a; border: 1px solid #2a2a2f; border-radius: 14px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  figure img { width: 100%; height: auto; display: block; background: #000; }
  figcaption { padding: 14px 16px 16px; }
  .t { font-size: 15px; font-weight: 650; }
  .d { margin-top: 5px; font-size: 12.5px; color: #8d8d95; line-height: 1.6; }
  .d code { color: #b5b5bd; font-size: 11.5px; }
  footer { max-width: 1080px; margin: 40px auto 0; font-size: 12.5px; color: #6d6d75; line-height: 1.8; }
</style>
</head>
<body>
<header>
  <h1>iPhone Duo 匹配截图</h1>
  <div class="meta">
    <span class="badge">已通过</span>
    设备：<code>BonePopoverKit QA</code>（iPhone Duo 模拟器）· 系统：iOS 27.1 · 分辨率：1398 × 2034<br>
    来源：UI 测试 <code>PopoverDemoUITests</code> 截图附件，2026-11-07 采集
  </div>
</header>
<div class="grid">
  <figure>
    <img src="duo-injected-book-fold.png" alt="书本折叠注入区域">
    <figcaption>
      <div class="t">注入书本折叠（Book Fold）</div>
      <div class="d">竖向折叠保留区域下，确认按钮完整位于区域一侧且可点击 · <code>testInjectedFoldRegionsKeepActionsReachable</code></div>
    </figcaption>
  </figure>
  <figure>
    <img src="duo-injected-tabletop-fold.png" alt="桌面折叠注入区域">
    <figcaption>
      <div class="t">注入桌面折叠（Tabletop Fold）</div>
      <div class="d">横向折叠保留区域下弹窗避让，另一侧保持可点击 · <code>testInjectedFoldRegionsKeepActionsReachable</code></div>
    </figcaption>
  </figure>
  <figure>
    <img src="duo-title-left.png" alt="标题左对齐">
    <figcaption>
      <div class="t">标题左对齐（默认）</div>
      <div class="d">标题位于内容顶部 24 点处，按钮左右等距 24 点 · <code>testTitleAlignmentAndFullWidthButtons</code></div>
    </figcaption>
  </figure>
  <figure>
    <img src="duo-title-center.png" alt="标题居中">
    <figcaption>
      <div class="t">标题居中</div>
      <div class="d"><code>titleAlignment = .center</code> 实时切换后的布局</div>
    </figcaption>
  </figure>
  <figure>
    <img src="duo-title-right.png" alt="标题右对齐">
    <figcaption>
      <div class="t">标题右对齐</div>
      <div class="d"><code>titleAlignment = .right</code> 实时切换后的布局</div>
    </figcaption>
  </figure>
  <figure>
    <img src="duo-sheet-title-right.png" alt="Sheet 标题右对齐">
    <figcaption>
      <div class="t">Sheet 形态 · 标题右对齐</div>
      <div class="d">导航容器内以 sheet 展示时的标题右对齐效果</div>
    </figcaption>
  </figure>
</div>
<footer>
  说明：这些截图验证的是 Duo 自动适配（折叠区域避让、非对称安全区、标题对齐与按钮布局）。注入几何测试通过不完全等同于实体 Duo 全姿态硬件验收，详见 Docs/Validation.md。<br>
  底部操作列表的阅读器默认样式（圆角仅顶部两角、无遮罩、标题左侧关闭按钮）另有 <a href="sheet-reader-default.html" style="color:#8ab4ff">单独截图页</a>。
</footer>
</body>
</html>
